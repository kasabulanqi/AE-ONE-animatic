<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CFMOTO - AE ONE 动态分镜评审面板</title>
    <style>
        :root {
            --bg-color: #0a0a0a;
            --panel-color: #141414;
            --accent-color: #00ffcc; /* CFMOTO 科技青 */
            --text-color: #ffffff;
            --tab-bg: #222222;
        }

        body {
            margin: 0;
            padding: 30px 20px;
            background-color: var(--bg-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 1100px;
            background-color: var(--panel-color);
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.6);
            border: 1px solid #222;
        }

        h2 {
            margin-top: 0;
            font-weight: 600;
            font-size: 1.3rem;
            color: #fff;
            letter-spacing: 1px;
            border-bottom: 1px solid #222;
            padding-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h2 span {
            font-size: 0.8rem;
            color: #666;
            font-family: monospace;
        }

        /* 场景分类切换标签 */
        .scene-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 1px solid #222;
            padding-bottom: 12px;
        }

        .tab-btn {
            background-color: var(--tab-bg);
            color: #aaa;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .tab-btn:hover {
            background-color: #333;
            color: #fff;
        }

        .tab-btn.active {
            background-color: var(--accent-color);
            color: #000;
            font-weight: 600;
        }

        /* 视频主窗口 */
        .video-window {
            width: 100%;
            aspect-ratio: 16 / 9;
            background-color: #000;
            border-radius: 6px;
            overflow: hidden;
            border: 1px solid #2a2a2a;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* 自定义时间轴 */
        .timeline-container {
            margin: 25px 0;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .time-display {
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.9rem;
            min-width: 110px;
            color: #888;
        }

        .timeline-bar {
            flex-grow: 1;
            height: 6px;
            background-color: #222;
            border-radius: 3px;
            cursor: pointer;
            position: relative;
            transition: height 0.2s;
        }

        .timeline-bar:hover {
            height: 8px;
        }

        .timeline-progress {
            height: 100%;
            width: 0%;
            background-color: var(--accent-color);
            border-radius: 3px;
        }

        /* 下方分镜缩略图轴 */
        .storyboard-nav {
            display: flex;
            gap: 14px;
            overflow-x: auto;
            padding: 15px 5px;
        }

        .storyboard-nav::-webkit-scrollbar {
            height: 6px;
        }
        .storyboard-nav::-webkit-scrollbar-thumb {
            background: #333;
            border-radius: 3px;
        }

        .shot-card {
            flex: 0 0 180px;
            cursor: pointer;
            border: 2px solid transparent;
            border-radius: 6px;
            overflow: hidden;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            background-color: #000;
        }

        .shot-card:hover {
            transform: translateY(-4px);
            border-color: #444;
        }

        .shot-card.active {
            border-color: var(--accent-color);
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.3);
        }

        .thumb-container {
            width: 100%;
            aspect-ratio: 16 / 9;
            background-color: #1a1a1a;
            position: relative;
            overflow: hidden;
        }

        .shot-thumb {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            opacity: 0.5;
            transition: opacity 0.2s;
        }

        .shot-card:hover .shot-thumb, 
        .shot-card.active .shot-thumb {
            opacity: 1;
        }

        .loading-spinner {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 0.75rem;
            color: #555;
            letter-spacing: 1px;
        }

        .shot-info {
            padding: 8px;
            font-size: 0.8rem;
            text-align: center;
            background: #0d0d0d;
            color: #888;
        }
        
        .shot-card.active .shot-info {
            color: var(--accent-color);
            background: #111;
        }

        /* 本地预览提示框 */
        .local-tip {
            margin-top: 25px;
            background-color: #1a1510;
            border: 1px solid #ff990033;
            padding: 15px;
            border-radius: 6px;
            font-size: 0.85rem;
            color: #ccc;
            line-height: 1.6;
            width: 100%;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>
        <div>AE ONE // ANIMATIC PREVIEW 动态分镜评审</div>
        <span>WORKSPACE: F:\CFMOTO\AE ONE\动态分镜\</span>
    </h2>

    <!-- 场景分类标签栏 -->
    <div class="scene-tabs" id="tabs-container">
        <!-- 由 JS 动态生成 -->
    </div>
    
    <!-- 主播放器 -->
    <div class="video-window">
        <video id="main-player" playsinline controls></video>
    </div>

    <!-- 时间轴 -->
    <div class="timeline-container">
        <div class="time-display" id="time-text">00:00 / 00:00</div>
        <div class="timeline-bar" id="timeline-bg">
            <div class="timeline-progress" id="timeline-file"></div>
        </div>
    </div>

    <!-- 故事板导航轴 -->
    <div class="storyboard-nav" id="storyboard-container"></div>

    <!-- 本地缩略图修复提示 -->
    <div class="local-tip">
        <strong>💡 本地预览提示：</strong>如果下方缩略图显示“RENDERING...”或“CORS限制”，是因为浏览器保护隐私，禁止网页直接读取本地硬盘像素。
        <br>解法：如果您使用 VS Code，请右键安装并点击 <strong>"Open with Live Server"</strong> 即可完美本地预览；或者直接将整个文件夹上传至网页服务器端，缩略图即可完全自动秒开。
    </div>
</div>

<script>
    // 【核心配置区】24个镜头已根据你的规则完美分类
    const sceneData = {
        "滴水湖": [
            { id: "SHOT_01", video: "videos/shot01.mp4" },
            { id: "SHOT_03", video: "videos/shot03.mp4" },
            { id: "SHOT_04", video: "videos/shot04.mp4" },
            { id: "SHOT_05", video: "videos/shot05.mp4" },
            { id: "SHOT_06", video: "videos/shot06.mp4" },
            { id: "SHOT_07", video: "videos/shot07.mp4" },
            { id: "SHOT_08", video: "videos/shot08.mp4" },
            { id: "SHOT_09", video: "videos/shot09.mp4" },
            { id: "SHOT_15", video: "videos/shot15.mp4" },
            { id: "SHOT_16", video: "videos/shot16.mp4" },
            { id: "SHOT_17", video: "videos/shot17.mp4" },
            { id: "SHOT_18", video: "videos/shot18.mp4" },
            { id: "SHOT_19", video: "videos/shot19.mp4" },
            { id: "SHOT_20", video: "videos/shot20.mp4" },
            { id: "SHOT_22", video: "videos/shot22.mp4" }
        ],
        "滑板场": [
            { id: "SHOT_02", video: "videos/shot02.mp4" },
            { id: "SHOT_10", video: "videos/shot10.mp4" },
            { id: "SHOT_11", video: "videos/shot11.mp4" },
            { id: "SHOT_12", video: "videos/shot12.mp4" },
            { id: "SHOT_13", video: "videos/shot13.mp4" },
            { id: "SHOT_14", video: "videos/shot14.mp4" },
            { id: "SHOT_21", video: "videos/shot21.mp4" },
            { id: "SHOT_23", video: "videos/shot23.mp4" },
            { id: "SHOT_24", video: "videos/shot24.mp4" }
        ]
    };

    let currentSceneKey = Object.keys(sceneData)[0]; // 默认当前场景
    let currentShotIndex = 0; // 当前选中的镜头索引
    
    const player = document.getElementById('main-player');
    const tabsContainer = document.getElementById('tabs-container');
    const storyboardContainer = document.getElementById('storyboard-container');
    const timeText = document.getElementById('time-text');
    const timelineProgress = document.getElementById('timeline-file');
    const timelineBg = document.getElementById('timeline-bg');

    // 1. 初始化渲染分类标签
    function initTabs() {
        tabsContainer.innerHTML = '';
        Object.keys(sceneData).forEach((sceneName, idx) => {
            const btn = document.createElement('button');
            btn.className = `tab-btn ${sceneName === currentSceneKey ? 'active' : ''}`;
            btn.textContent = sceneName;
            btn.addEventListener('click', () => {
                currentSceneKey = sceneName;
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                
                // 切换场景后，默认加载新场景的第一个镜头，但不播放
                renderStoryboard();
                switchShot(0, false); 
            });
            tabsContainer.appendChild(btn);
        });
    }

    // 2. 渲染当前场景的分镜轴
    function renderStoryboard() {
        storyboardContainer.innerHTML = '';
        const currentPlaylist = sceneData[currentSceneKey];
        
        currentPlaylist.forEach((shot, index) => {
            const card = document.createElement('div');
            card.className = `shot-card ${index === currentShotIndex ? 'active' : ''}`;
            card.setAttribute('data-index', index);
            
            card.innerHTML = `
                <div class="thumb-container" id="thumb-box-${index}">
                    <span class="loading-spinner">RENDERING...</span>
                </div>
                <div class="shot-info">${shot.id}</div>
            `;
            
            // 点击缩略图：仅切换并定位到首帧，不直接自动播放
            card.addEventListener('click', () => switchShot(index, false));
            storyboardContainer.appendChild(card);

            // 异步自动截取视频首帧
            generateVideoFirstFrame(shot.video, index);
        });
    }

    // 3. 自动截屏核心函数
    function generateVideoFirstFrame(videoUrl, index) {
        const tempVideo = document.createElement('video');
        tempVideo.src = videoUrl;
        tempVideo.muted = true;
        tempVideo.preload = "metadata";
        tempVideo.currentTime = 0.05; // 避开纯黑帧

        tempVideo.addEventListener('seeked', () => {
            try {
                const canvas = document.createElement('canvas');
                canvas.width = 320;
                canvas.height = 180;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(tempVideo, 0, 0, canvas.width, canvas.height);
                
                const dataURL = canvas.toDataURL('image/jpeg', 0.8);
                const thumbBox = document.getElementById(`thumb-box-${index}`);
                if (thumbBox) {
                    thumbBox.innerHTML = `<img class="shot-thumb" src="${dataURL}" alt="Preview">`;
                }
            } catch (e) {
                const thumbBox = document.getElementById(`thumb-box-${index}`);
                if (thumbBox) {
                    thumbBox.innerHTML = `<span class="loading-spinner" style="color:#aaa; font-size:0.65rem;">CORS限制</span>`;
                }
            }
            tempVideo.src = '';
            tempVideo.load();
        });
    }

    // 4. 切换镜头函数 (playImmediately 控制是否自动播放)
    function switchShot(index, playImmediately = false) {
        const currentPlaylist = sceneData[currentSceneKey];
        if (index < 0 || index >= currentPlaylist.length) return;
        
        document.querySelectorAll('.shot-card').forEach((card, i) => {
            card.classList.toggle('active', i === index);
        });

        currentShotIndex = index;
        player.src = currentPlaylist[index].video;
        player.load(); 
        
        if (playImmediately) {
            player.play().catch(err => console.log("播放被拦截"));
        }
    }

    // 5. 基础时间控制逻辑
    function formatTime(seconds) {
        if (isNaN(seconds)) return "00:00";
        const mins = Math.floor(seconds / 60).toString().padStart(2, '0');
        const secs = Math.floor(seconds % 60).toString().padStart(2, '0');
        return `${mins}:${secs}`;
    }

    player.addEventListener('timeupdate', () => {
        const current = player.currentTime;
        const total = player.duration || 0;
        timeText.textContent = `${formatTime(current)} / ${formatTime(total)}`;
        if (total > 0) {
            timelineProgress.style.width = `${(current / total) * 100}%`;
        }
    });

    // 连播逻辑：当点击播放后，该场景内的镜头会自动往下连播
    player.addEventListener('ended', () => {
        const currentPlaylist = sceneData[currentSceneKey];
        if (currentShotIndex < currentPlaylist.length - 1) {
            switchShot(currentShotIndex + 1, true); // 自动切下一镜并继续播放
        } else {
            switchShot(0, false); // 该类别放完，回到本分类第一个镜头并静止
        }
    });

    timelineBg.addEventListener('click', (e) => {
        const rect = timelineBg.getBoundingClientRect();
        if (player.duration) {
            player.currentTime = ((e.clientX - rect.left) / rect.width) * player.duration;
        }
    });

    // 初始化运行
    initTabs();
    renderStoryboard();
    switchShot(0, false); // 默认首镜静止
</script>
</body>
</html>
