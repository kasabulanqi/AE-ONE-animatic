<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CFMOTO - AE ONE 动态分镜评审面板</title>
    <style>
        :root {
            --bg-color: #0a0a0a;
            --panel-color: #141414;
            --accent-color: #00ffcc; /* CFMOTO 科技青 */
            --text-color: #ffffff;
            --tab-bg: #222222;
        }

        body {
            margin: 0;
            padding: 30px 20px;
            background-color: var(--bg-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 1100px;
            background-color: var(--panel-color);
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.6);
            border: 1px solid #222;
        }

        h2 {
            margin-top: 0;
            font-weight: 600;
            font-size: 1.3rem;
            color: #fff;
            letter-spacing: 1px;
            border-bottom: 1px solid #222;
            padding-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h2 span {
            font-size: 0.8rem;
            color: #666;
            font-family: monospace;
        }

        /* 场景分类切换标签 */
        .scene-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 1px solid #222;
            padding-bottom: 12px;
        }

        .tab-btn {
            background-color: var(--tab-bg);
            color: #aaa;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .tab-btn:hover {
            background-color: #333;
            color: #fff;
        }

        .tab-btn.active {
            background-color: var(--accent-color);
            color: #000;
            font-weight: 600;
        }

        /* 视频主窗口 */
        .video-window {
            width: 100%;
            aspect-ratio: 16 / 9;
            background-color: #000;
            border-radius: 6px;
            overflow: hidden;
            border: 1px solid #2a2a2a;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* 自定义时间轴 */
        .timeline-container {
            margin: 25px 0;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .time-display {
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.9rem;
            min-width: 110px;
            color: #888;
        }

        .timeline-bar {
            flex-grow: 1;
            height: 6px;
            background-color: #222;
            border-radius: 3px;
            cursor: pointer;
            position: relative;
            transition: height 0.2s;
        }

        .timeline-bar:hover {
            height: 8px;
        }

        .timeline-progress {
            height: 100%;
            width: 0%;
            background-color: var(--accent-color);
            border-radius: 3px;
        }

        /* 下方分镜缩略图轴 */
        .storyboard-nav {
            display: flex;
            gap: 14px;
            overflow-x: auto;
            padding: 15px 5px;
        }

        .storyboard-nav::-webkit-scrollbar {
            height: 6px;
        }
        .storyboard-nav::-webkit-scrollbar-thumb {
            background: #333;
            border-radius: 3px;
        }

        .shot-card {
            flex: 0 0 180px;
            cursor: pointer;
            border: 2px solid transparent;
            border-radius: 6px;
            overflow: hidden;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            background-color: #000;
        }

        .shot-card:hover {
            transform: translateY(-4px);
            border-color: #444;
        }

        .shot-card.active {
            border-color: var(--accent-color);
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.3);
        }

        .thumb-container {
            width: 100%;
            aspect-ratio: 16 / 9;
            background-color: #1a1a1a;
            position: relative;
            overflow: hidden;
        }

        .shot-thumb {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            opacity: 0.5;
            transition: opacity 0.2s;
        }

        .shot-card:hover .shot-thumb, 
        .shot-card.active .shot-thumb {
            opacity: 1;
        }

        .loading-spinner {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 0.75rem;
            color: #555;
            letter-spacing: 1px;
        }

        .shot-info {
            padding: 8px;
            font-size: 0.8rem;
            text-align: center;
            background: #0d0d0d;
            color: #888;
        }
        
        .shot-card.active .shot-info {
            color: var(--accent-color);
            background: #111;
        }

        /* 本地预览提示框 */
        .local-tip {
            margin-top: 25px;
            background-color: #1a1510;
            border: 1px solid #ff990033;
            padding: 15px;
            border-radius: 6px;
            font-size: 0.85rem;
            color: #ccc;
            line-height: 1.6;
            width: 100%;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>
        <div>AE ONE // ANIMATIC PREVIEW 动态分镜评审</div>
        <span>WORKSPACE: F:\CFMOTO\AE ONE\动态分镜\</span>
    </h2>

    <div class="scene-tabs" id="tabs-container">
        </div>
    
    <div class="video-window">
        <video id="main-player" playsinline controls></video>
    </div>

    <div class="timeline-container">
        <div class="time-display" id="time-text">00:00 / 00:00</div>
        <div class="timeline-bar" id="timeline-bg">
            <div class="timeline-progress" id="timeline-file"></div>
        </div>
    </div>

    <div class="storyboard-nav" id="storyboard-container"></div>

    <div class="local-tip">
        <strong>💡 手机端查看提示：</strong>如果修改后依旧不显示，是由于微信/Safari强缓存导致。请在手机浏览器中开启“无痕/隐私模式”打开网址，即可完美看到首帧！
    </div>
</div>
