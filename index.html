<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CFMOTO - AE ONE 动态分镜评审面板</title>
    <style>
        :root {
            --bg-color: #0a0a0a;
            --panel-color: #141414;
            --accent-color: #00ffcc; /* CFMOTO 科技青 */
            --text-color: #ffffff;
            --tab-bg: #222222;
        }

        body {
            margin: 0;
            padding: 30px 20px;
            background-color: var(--bg-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 1100px;
            background-color: var(--panel-color);
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.6);
            border: 1px solid #222;
        }

        h2 {
            margin-top: 0;
            font-weight: 600;
            font-size: 1.3rem;
            color: #fff;
            letter-spacing: 1px;
            border-bottom: 1px solid #222;
            padding-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h2 span {
            font-size: 0.8rem;
            color: #666;
            font-family: monospace;
        }

        /* 场景分类切换标签 */
        .scene-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 1px solid #222;
            padding-bottom: 12px;
        }

        .tab-btn {
            background-color: var(--tab-bg);
            color: #aaa;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .tab-btn:hover {
            background-color: #333;
            color: #fff;
        }

        .tab-btn.active {
            background-color: var(--accent-color);
            color: #000;
            font-weight: 600;
        }

        /* 视频主窗口 */
        .video-window {
            width: 100%;
            aspect-ratio: 16 / 9;
            background-color: #000;
            border-radius: 6px;
            overflow: hidden;
            border: 1px solid #2a2a2a;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* 自定义时间轴 */
        .timeline-container {
            margin: 25px 0;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .time-display {
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.9rem;
            min-width: 110px;
            color: #888;
        }

        .timeline-bar {
            flex-grow: 1;
            height: 6px;
            background-color: #222;
            border-radius: 3px;
            cursor: pointer;
            position: relative;
            transition: height 0.2s;
        }

        .timeline-bar:hover {
            height: 8px;
        }

        .timeline-progress {
            height: 100%;
            width: 0%;
            background-color: var(--accent-color);
            border-radius: 3px;
        }

        /* 下方分镜缩略图轴 */
        .storyboard-nav {
            display: flex;
            gap: 14px;
            overflow-x: auto;
            padding: 15px 5px;
        }

        .storyboard-nav::-webkit-scrollbar {
            height: 6px;
        }
        .storyboard-nav::-webkit-scrollbar-thumb {
            background: #333;
            border-radius: 3px;
        }

        .shot-card {
            flex: 0 0 180px;
            cursor: pointer;
            border: 2px solid transparent;
            border-radius: 6px;
            overflow: hidden;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            background-color: #000;
        }

        .shot-card:hover {
            transform: translateY(-4px);
            border-color: #444;
        }

        .shot-card.active {
            border-color: var(--accent-color);
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.3);
        }

        .thumb-container {
            width: 100%;
            aspect-ratio: 16 / 9;
            background-color: #1a1a1a;
            position: relative;
            overflow: hidden;
        }

        .shot-thumb {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            opacity: 0.5;
            transition: opacity 0.2s;
        }

        .shot-card:hover .shot-thumb, 
        .shot-card.active .shot-thumb {
            opacity: 1;
        }

        .shot-info {
            padding: 8px;
            font-size: 0.8rem;
            text-align: center;
            background: #0d0d0d;
            color: #888;
        }
        
        .shot-card.active .shot-info {
            color: var(--accent-color);
            background: #111;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>
        <div>AE ONE // ANIMATIC PREVIEW 动态分镜评审</div>
        <span>WORKSPACE: kasabulanqi.github.io</span>
    </h2>

    <div class="scene-tabs" id="tabs-container"></div>
    
    <div class="video-window">
        <video id="main-player" playsinline controls></video>
    </div>

    <div class="timeline-container">
        <div class="time-display" id="time-text">00:00 / 00:00</div>
        <div class="timeline-bar" id="timeline-bg">
            <div class="timeline-progress" id="timeline-file"></div>
        </div>
    </div>

    <div class="storyboard-nav" id="storyboard-container"></div>
</div>

<script>
    // 【终极配置区】24个镜头归类，并显式指定了 images 目录下的缩略图
    const sceneData = {
        "滴水湖": [
            { id: "SHOT_01", video: "videos/shot01.mp4", thumb: "images/shot01.jpg" },
            { id: "SHOT_03", video: "videos/shot03.mp4", thumb: "images/shot03.jpg" },
            { id: "SHOT_04", video: "videos/shot04.mp4", thumb: "images/shot04.jpg" },
            { id: "SHOT_05", video: "videos/shot05.mp4", thumb: "images/shot05.jpg" },
            { id: "SHOT_06", video: "videos/shot06.mp4", thumb: "images/shot06.jpg" },
            { id: "SHOT_07", video: "videos/shot07.mp4", thumb: "images/shot07.jpg" },
            { id: "SHOT_08", video: "videos/shot08.mp4", thumb: "images/shot08.jpg" },
            { id: "SHOT_09", video: "videos/shot09.mp4", thumb: "images/shot09.jpg" },
            { id: "SHOT_15", video: "videos/shot15.mp4", thumb: "images/shot15.jpg" },
            { id: "SHOT_16", video: "videos/shot16.mp4", thumb: "images/shot16.jpg" },
            { id: "SHOT_17", video: "videos/shot17.mp4", thumb: "images/shot17.jpg" },
            { id: "SHOT_18", video: "videos/shot18.mp4", thumb: "images/shot18.jpg" },
            { id: "SHOT_19", video: "videos/shot19.mp4", thumb: "images/shot19.jpg" },
            { id: "SHOT_20", video: "videos/shot20.mp4", thumb: "images/shot20.jpg" },
            { id: "SHOT_22", video: "videos/shot22.mp4", thumb: "images/shot22.jpg" }
        ],
        "滑板场": [
            { id: "SHOT_02", video: "videos/shot02.mp4", thumb: "images/shot02.jpg" },
            { id: "SHOT_10", video: "videos/shot10.mp4", thumb: "images/shot10.jpg" },
            { id: "SHOT_11", video: "videos/shot11.mp4", thumb: "images/shot11.jpg" },
            { id: "SHOT_12", video: "videos/shot12.mp4", thumb: "images/shot12.jpg" },
            { id: "SHOT_13", video: "videos/shot13.mp4", thumb: "images/shot13.jpg" },
            { id: "SHOT_14", video: "videos/shot14.mp4", thumb: "images/shot14.jpg" },
            { id: "SHOT_21", video: "videos/shot21.mp4", thumb: "images/shot21.jpg" },
            { id: "SHOT_23", video: "videos/shot23.mp4", thumb: "images/shot23.jpg" },
            { id: "SHOT_24", video: "videos/shot24.mp4", thumb: "images/shot24.jpg" }
        ]
    };

    let currentSceneKey = Object.keys(sceneData)[0]; 
    let currentShotIndex = 0; 
    
    const player = document.getElementById('main-player');
    const tabsContainer = document.getElementById('tabs-container');
    const storyboardContainer = document.getElementById('storyboard-container');
    const timeText = document.getElementById('time-text');
    const timelineProgress = document.getElementById('timeline-file');
    const timelineBg = document.getElementById('timeline-bg');

    function initTabs() {
        tabsContainer.innerHTML = '';
        Object.keys(sceneData).forEach((sceneName) => {
            const btn = document.createElement('button');
            btn.className = `tab-btn ${sceneName === currentSceneKey ? 'active' : ''}`;
            btn.textContent = sceneName;
            btn.addEventListener('click', () => {
                currentSceneKey = sceneName;
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                renderStoryboard();
                switchShot(0, false); 
            });
            tabsContainer.appendChild(btn);
        });
    }

    function renderStoryboard() {
        storyboardContainer.innerHTML = '';
        const currentPlaylist = sceneData[currentSceneKey];
        
        currentPlaylist.forEach((shot, index) => {
            const card = document.createElement('div');
            card.className = `shot-card ${index === currentShotIndex ? 'active' : ''}`;
            card.setAttribute('data-index', index);
            card.innerHTML = `
                <div class="thumb-container">
                    <img class="shot-thumb" src="${shot.thumb}" alt="Preview">
                </div>
                <div class="shot-info">${shot.id}</div>
            `;
            card.addEventListener('click', () => switchShot(index, false));
            storyboardContainer.appendChild(card);
        });
    }

    function switchShot(index, playImmediately = false) {
        const currentPlaylist = sceneData[currentSceneKey];
        if (index < 0 || index >= currentPlaylist.length) return;
        
        document.querySelectorAll('.shot-card').forEach((card, i) => {
            card.classList.toggle('active', i === index);
        });

        currentShotIndex = index;
        player.src = currentPlaylist[index].video;
        // 设置播放器封面图，保证大屏没播放前也有画面
        player.poster = currentPlaylist[index].thumb;
        player.load(); 
        
        if (playImmediately) {
            player.play().catch(err => console.log("播放被拦截"));
        }
    }

    function formatTime(seconds) {
        if (isNaN(seconds)) return "00:00";
        const mins = Math.floor(seconds / 60).toString().padStart(2, '0');
        const secs = Math.floor(seconds % 60).toString().padStart(2, '0');
        return `${mins}:${secs}`;
    }

    player.addEventListener('timeupdate', () => {
        const current = player.currentTime;
        const total = player.duration || 0;
        timeText.textContent = `${formatTime(current)} / ${formatTime(total)}`;
        if (total > 0) {
            timelineProgress.style.width = `${(current / total) * 100}%`;
        }
    });

    player.addEventListener('ended', () => {
        const currentPlaylist = sceneData[currentSceneKey];
        if (currentShotIndex < currentPlaylist.length - 1) {
            switchShot(currentShotIndex + 1, true); 
        } else {
            switchShot(0, false); 
        }
    });

    timelineBg.addEventListener('click', (e) => {
        const rect = timelineBg.getBoundingClientRect();
        if (player.duration) {
            player.currentTime = ((e.clientX - rect.left) / rect.width) * player.duration;
        }
    });

    // 初始化运行
    initTabs();
    renderStoryboard();
    switchShot(0, false);
</script>
</body>
</html>
